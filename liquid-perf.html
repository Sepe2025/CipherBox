<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass 性能压测</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:12px;
    font-family:system-ui,-apple-system,sans-serif;
    background:
      repeating-linear-gradient(45deg,#123 0 16px,#1a2a44 16px 32px),
      radial-gradient(circle at 30% 10%, #2b6 0 10%, transparent 32%),
      radial-gradient(circle at 78% 62%, #c46 0 12%, transparent 36%),
      #0b1220;
    color:#fff;
  }
  .card{
    position:relative; overflow:hidden; isolation:isolate;
    border-radius:24px; padding:16px; margin-bottom:12px;
    background:linear-gradient(163deg,rgba(255,255,255,.20),rgba(255,255,255,.055));
    border:1px solid rgba(255,255,255,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.38), 0 14px 34px -12px rgba(0,0,0,.6);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    contain: paint;
  }
  .card h3{ margin:0 0 8px; font-size:15px; font-weight:650; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .b{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:40px; padding:0 14px; border-radius:999px;
    font-size:13px; font-weight:600;
    background:linear-gradient(158deg,rgba(255,255,255,.30),rgba(255,255,255,.09));
    border:1px solid rgba(255,255,255,.30);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    contain: paint;
  }
  /* 固定悬浮元素：顶栏 + FAB（真实项目里始终可见） */
  .bar{
    position:fixed; top:0; left:0; right:0; height:56px; z-index:50;
    background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.06));
    border-bottom:1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(30px) saturate(190%);
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    contain: paint;
  }
  .fab{
    position:fixed; right:16px; bottom:80px; z-index:50;
    width:58px; height:58px; border-radius:22px;
    background:linear-gradient(158deg,rgba(255,255,255,.34),rgba(255,255,255,.12));
    border:1px solid rgba(255,255,255,.34);
    backdrop-filter: blur(20px) saturate(190%);
    -webkit-backdrop-filter: blur(20px) saturate(190%);
    contain: paint;
  }

  /* ---- 边缘折射层 ---- */
  .lg-edge::before{
    content:''; position:absolute; inset:0; border-radius:inherit;
    backdrop-filter: blur(2px) url(#lg-dist);
    -webkit-backdrop-filter: blur(2px) saturate(180%);
    padding:14px;
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    mask-composite:exclude;
    pointer-events:none;
  }
  .b.lg-edge::before{ padding:10px; }

  /* 档位：默认全部关闭折射 */
  .lg-edge::before{ content:none; }

  /* 档 2：只有 2 个固定悬浮层折射 */
  body.m-few .bar.lg-edge::before,
  body.m-few .fab.lg-edge::before{ content:''; }

  /* 档 3：悬浮层 + 全部卡片折射（按钮不折射） */
  body.m-cards .bar.lg-edge::before,
  body.m-cards .fab.lg-edge::before,
  body.m-cards .card.lg-edge::before{ content:''; }

  /* 档 4：全部折射（卡片 + 按钮） */
  body.m-all .lg-edge::before{ content:''; }

  #hud{
    position:fixed; left:12px; bottom:12px; z-index:9999;
    background:rgba(0,0,0,.82); border:1px solid rgba(255,255,255,.2);
    border-radius:12px; padding:10px 14px;
    font-family:ui-monospace,monospace; font-size:11px; line-height:1.7;
    white-space:pre; max-width:calc(100vw - 24px);
  }
</style>
</head>
<body>

<div class="bar lg-edge"></div>
<div class="fab lg-edge"></div>
<div id="hud">测速中…</div>
<div id="list" style="padding-top:56px"></div>

<svg width="0" height="0" style="position:absolute;left:-9999px" aria-hidden="true">
  <defs>
    <filter id="lg-dist" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred"/>
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="60" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<script>
  const list = document.getElementById('list');
  for (let i = 0; i < 8; i++) {
    const c = document.createElement('div');
    c.className = 'card lg-edge';
    c.innerHTML = '<h3>记录 ' + (i + 1) + '</h3>' +
      '<div class="row"><span class="b lg-edge">复制账号</span><span class="b lg-edge">复制密码</span>' +
      '<span class="b lg-edge">显示</span><span class="b lg-edge">打开</span><span class="b lg-edge">更多</span></div>';
    list.appendChild(c);
  }

  window.scrollTo(0, 0);

  async function measure(mode, ms) {
    document.body.className = 'm-' + mode;
    await new Promise(r => setTimeout(r, 450));
    const deltas = [];
    let last = performance.now(), stop = false;
    const tick = (now) => {
      if (stop) return;
      deltas.push(now - last); last = now;
      window.scrollBy(0, 40);
      if (window.scrollY + window.innerHeight >= document.body.scrollHeight - 4) window.scrollTo(0, 0);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    await new Promise(r => setTimeout(r, ms));
    stop = true;
    deltas.shift();
    deltas.sort((a, b) => a - b);
    const med = deltas[Math.floor(deltas.length / 2)] || 0;
    const p95 = deltas[Math.floor(deltas.length * 0.95)] || 0;
    return { mode, median: +med.toFixed(2), p95: +p95.toFixed(2), fps: med ? +(1000 / med).toFixed(1) : 0 };
  }

  (async () => {
    const res = [];
    for (const m of ['base', 'few', 'cards', 'all']) res.push(await measure(m, 1800));
    window.scrollTo(0, 0);
    const pad = (s, n) => String(s).padEnd(n);
    const lines = res.map(r =>
      pad(r.mode, 7) + ' 中位 ' + pad(r.median + 'ms', 8) + ' p95 ' + pad(r.p95 + 'ms', 8) + ' ≈ ' + pad(r.fps + ' fps', 9));
    const base = res[0].fps;
    const deg = res.map(r => pad(r.mode, 7) + ' ' + (r.fps / base * 100).toFixed(0) + '%').join('\n');
    document.getElementById('hud').textContent =
      '8 卡片 + 40 按钮（全部含 backdrop-filter）\n' + lines.join('\n') + '\n相对基准：\n' + deg;
    window.__perf = { modes: res };
    window.__ready = true;
  })();
</script>
</body>
</html>
